<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Master Command</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f3f6fa;--card:#fff;--text:#152033;--muted:#718096;--primary:#2563eb;--primary2:#4f46e5;--line:#e6eaf0;--chip:#eef4ff;--nav:rgba(255,255,255,.94)}
body.dark{--bg:#0b1017;--card:#151b24;--text:#f4f7fb;--muted:#9aa6b5;--line:#28313d;--chip:#1d2a3d;--nav:rgba(21,27,36,.96)}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:78px}
button,input{font:inherit}
.top{position:sticky;top:0;z-index:20;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:var(--nav);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary2));font-size:20px;font-weight:900}
.h1{font-size:18px;font-weight:850;letter-spacing:-.3px}.sub{font-size:10px;color:var(--muted);margin-top:2px}
.iconbtn{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}
.search{position:relative;margin-top:12px}.search input{width:100%;height:46px;border:1px solid var(--line);border-radius:14px;padding:0 44px 0 42px;outline:none;background:var(--bg);color:var(--text);font-size:14px}.search span{position:absolute;left:14px;top:13px;color:var(--muted)}.clear{position:absolute;right:8px;top:6px;width:34px;height:34px;border:0;background:transparent;color:var(--muted);display:none}
.quick{display:flex;gap:7px;overflow:auto;padding-top:9px;scrollbar-width:none}.quick::-webkit-scrollbar{display:none}.quick button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:7px 10px;font-size:11px;white-space:nowrap}
.main{padding:12px}
.stats{display:flex;gap:8px;margin-bottom:10px}.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:9px 10px}.stat b{display:block;font-size:15px}.stat span{font-size:9px;color:var(--muted)}
.section{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:9px;overflow:hidden;box-shadow:0 2px 8px rgba(15,23,42,.035)}
.section-head{display:flex;align-items:center;gap:10px;min-height:59px;padding:10px 12px;cursor:pointer}
.section-icon{width:37px;height:37px;border-radius:11px;display:grid;place-items:center;background:var(--chip);flex:none}
.section-info{min-width:0;flex:1}.section-title{font-size:13px;font-weight:800}.section-meta{font-size:9px;color:var(--muted);margin-top:3px}
.chev{font-size:20px;color:var(--muted);transition:.2s}.section.open .chev{transform:rotate(90deg)}
.section-body{display:none;border-top:1px solid var(--line);padding:4px 12px 12px}.section.open .section-body{display:block}
.cmd{padding:9px 0;border-bottom:1px solid var(--line)}.cmd:last-child{border-bottom:0}
.cmdrow{display:flex;align-items:center;gap:7px}.code{flex:1;min-width:0;padding:9px 10px;background:var(--chip);color:var(--primary);border-radius:10px;font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
.copy{width:38px;height:38px;flex:none;border:0;border-radius:10px;background:var(--primary);color:white}.copy:active{transform:scale(.94)}
.example{margin-top:7px;padding:8px 9px;border-left:3px solid var(--primary);background:var(--bg);border-radius:7px;color:var(--muted);font-size:10px;line-height:1.45}
.example b{color:var(--text)}
.empty{text-align:center;padding:45px 20px;color:var(--muted);display:none}.empty strong{display:block;color:var(--text);margin-bottom:4px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--nav);border-top:1px solid var(--line);backdrop-filter:blur(16px);display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.navbtn{border:0;background:transparent;color:var(--muted);padding:5px 2px;font-size:10px}.navbtn b{display:block;font-size:17px;margin-bottom:2px}.navbtn.active{color:var(--primary)}
.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,15px);background:#111827;color:white;border-radius:12px;padding:9px 13px;font-size:11px;opacity:0;pointer-events:none;transition:.2s;z-index:50;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}

/* ===== Native-like PWA enhancements ===== */
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.app-install{display:none;margin:10px 12px 0;padding:12px 14px;border:1px solid #bfdbfe;background:#eff6ff;border-radius:16px;align-items:center;justify-content:space-between;gap:10px}
.app-install.show{display:flex}
.app-install strong{display:block;font-size:14px}.app-install small{display:block;color:#64748b;margin-top:2px}
.install-btn{border:0;background:#2563eb;color:#fff;border-radius:12px;padding:9px 12px;font-weight:700}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:11px 15px;border-radius:14px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:9999;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.online-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:5px}
.offline .online-dot{background:#f59e0b}
.update-bar{display:none;margin:8px 12px 0;padding:10px 12px;border-radius:14px;background:#111827;color:#fff;font-size:13px;align-items:center;justify-content:space-between;gap:10px}
.update-bar.show{display:flex}.update-bar button{border:0;border-radius:9px;padding:7px 10px;font-weight:700}
@media(min-width:700px){body{padding-bottom:20px}.app-install,.update-bar{max-width:760px;margin-left:auto;margin-right:auto}}


.pwa-diagnostic{margin:16px 12px 100px;padding:16px;border:1px solid #e5e7eb;border-radius:18px;background:var(--card,#fff);box-shadow:0 5px 20px rgba(15,23,42,.05)}
.pwa-diagnostic h3{margin:0 0 6px;font-size:16px}.pwa-diagnostic p{margin:0 0 12px;font-size:12px;color:#64748b}
.pwa-check{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eef2f7;font-size:13px}.pwa-check:last-child{border-bottom:0}
.pwa-ok{color:#16a34a;font-weight:700}.pwa-bad{color:#dc2626;font-weight:700}
.pwa-tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.pwa-tools button{border:0;border-radius:10px;padding:9px 11px;font-weight:700}

</style>
</head>
<body>

<div class="app-install" id="installBanner">
  <div>
    <strong>Pasang Master Command</strong>
    <small>Gunakan seperti aplikasi di ponsel.</small>
  </div>
  <button class="install-btn" id="installBtn">Install</button>
</div>
<div class="update-bar" id="updateBar">
  <span>Versi baru tersedia.</span>
  <button id="updateBtn">Perbarui</button>
</div>
<div class="toast" id="toast"></div>


<header class="top">
  <div class="toprow">
    <div class="brand">
      <div class="logo">⚡</div>
      <div><div class="h1">Master Command</div><div class="sub">Shortcut & Command Library</div></div>
    </div>
    <button class="iconbtn" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>
  <div class="search">
    <span>🔎</span>
    <input id="search" type="search" placeholder="Cari command atau kategori..." autocomplete="off">
    <button class="clear" id="clearBtn" onclick="clearSearch()">✕</button>
  </div>
  <div class="quick">
    <button onclick="openAll()">Buka semua</button>
    <button onclick="closeAll()">Tutup semua</button>
    <button onclick="focusSearch()">Cari</button>
  </div>
</header>

<main class="main">
  <div class="stats">
    <div class="stat"><b id="sectionCount">0</b><span>Kategori</span></div>
    <div class="stat"><b id="commandCount">0</b><span>Command</span></div>
    <div class="stat"><b id="favoriteCount">0</b><span>Favorit</span></div>
  </div>
  <div id="list"></div>
  <div class="empty" id="empty"><strong>Tidak ditemukan</strong>Coba kata kunci atau command lain.</div>
</main>

<nav class="bottom">
  <button class="navbtn active" onclick="home()"><b>⌂</b>Home</button>
  <button class="navbtn" onclick="openAll()"><b>▾</b>Kategori</button>
  <button class="navbtn" onclick="showFavorites()"><b>★</b>Favorit</button>
  <button class="navbtn" onclick="focusSearch()"><b>⌕</b>Cari</button>
</nav>

const favs = new Set(JSON.parse(localStorage.getItem("masterFavs") || "[]"));

function esc(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
}

function render(list=DATA){
  const box=document.getElementById("list");
  box.innerHTML="";
  let total=0;
  list.forEach(sec=>{
    total += sec.commands.length;
    const el=document.createElement("section");
    el.className="section";
    el.dataset.id=sec.id;
    el.innerHTML=`
      <div class="section-head" onclick="toggleSection(${sec.id})">
        <div class="section-icon">${sec.icon}</div>
        <div class="section-info">
          <div class="section-title">${esc(sec.title)}</div>
          <div class="section-meta">${sec.commands.length} command${sec.commands.length!==1?"s":""}</div>
        </div>
        <div class="chev">›</div>
      </div>
      <div class="section-body">
        ${sec.commands.map(cmd=>`
          <div class="cmd" data-cmd="${esc(cmd.toLowerCase())}">
            <div class="cmdrow">
              <div class="code">${esc(cmd)}</div>
              <button class="copy" onclick="copyCommand('${String(cmd).replace(/'/g,"\\'")}');event.stopPropagation()">📋</button>
            </div>
            <button onclick="toggleFav('${String(cmd).replace(/'/g,"\\'")}');event.stopPropagation()" style="margin-top:6px;border:0;background:transparent;color:var(--muted);font-size:10px;padding:0">
              ${favs.has(cmd)?"★ Hapus favorit":"☆ Tambah favorit"}
            </button>
          </div>
        `).join("")}
        ${sec.example?`<div class="example"><b>Contoh:</b> ${esc(sec.example)}</div>`:""}
      </div>`;
    box.appendChild(el);
  });
  document.getElementById("sectionCount").textContent=DATA.length;
  document.getElementById("commandCount").textContent=total;
  document.getElementById("favoriteCount").textContent=favs.size;
}

function toggleSection(id){
  const el=document.querySelector(`.section[data-id="${id}"]`);
  if(el) el.classList.toggle("open");
}
function openAll(){document.querySelectorAll(".section").forEach(x=>x.classList.add("open"))}
function closeAll(){document.querySelectorAll(".section").forEach(x=>x.classList.remove("open"))}
function copyCommand(cmd){
  if(navigator.clipboard){navigator.clipboard.writeText(cmd).then(()=>toast(cmd+" disalin ✓"))}
  else {const t=document.createElement("textarea");t.value=cmd;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();toast(cmd+" disalin ✓")}
}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove("show"),1700)}
function toggleFav(cmd){
  favs.has(cmd)?favs.delete(cmd):favs.add(cmd);
  localStorage.setItem("masterFavs",JSON.stringify([...favs]));
  renderFiltered(document.getElementById("search").value);
  toast(favs.has(cmd)?"Ditambahkan ke favorit ★":"Dihapus dari favorit");
}
function renderFiltered(q){
  q=q.trim().toLowerCase();
  if(!q){render(DATA);return}
  const filtered=DATA.map(s=>({...s,commands:s.commands.filter(c=>c.toLowerCase().includes(q)),_match:s.title.toLowerCase().includes(q)||s.example.toLowerCase().includes(q)}))
    .filter(s=>s._match||s.commands.length);
  render(filtered);
  document.querySelectorAll(".section").forEach(x=>x.classList.add("open"));
  document.getElementById("empty").style.display=filtered.length?"none":"block";
}
function showFavorites(){
  const filtered=DATA.map(s=>({...s,commands:s.commands.filter(c=>favs.has(c))})).filter(s=>s.commands.length);
  render(filtered);
  document.querySelectorAll(".section").forEach(x=>x.classList.add("open"));
  document.getElementById("empty").style.display=filtered.length?"none":"block";
}
function focusSearch(){document.getElementById("search").focus();window.scrollTo({top:0,behavior:"smooth"})}
function clearSearch(){const s=document.getElementById("search");s.value="";document.getElementById("clearBtn").style.display="none";render(DATA);document.getElementById("empty").style.display="none"}
function home(){clearSearch();window.scrollTo({top:0,behavior:"smooth"})}
function toggleTheme(){
  document.body.classList.toggle("dark");
  const dark=document.body.classList.contains("dark");
  document.getElementById("themeBtn").textContent=dark?"☀️":"🌙";
  localStorage.setItem("masterTheme",dark?"dark":"light");
}
document.getElementById("search").addEventListener("input",e=>{
  document.getElementById("clearBtn").style.display=e.target.value?"block":"none";
  renderFiltered(e.target.value);
});
if(localStorage.getItem("masterTheme")==="dark"){document.body.classList.add("dark");document.getElementById("themeBtn").textContent="☀️"}
render();
</script>

<script>
(function(){
  let deferredPrompt = null;
  const installBanner = document.getElementById('installBanner');
  const installBtn = document.getElementById('installBtn');
  const toast = document.getElementById('toast');
  const updateBar = document.getElementById('updateBar');
  const updateBtn = document.getElementById('updateBtn');

  function showToast(msg){
    if(!toast) return;
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(()=>toast.classList.remove('show'), 2200);
  }

  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredPrompt = e;
    installBanner?.classList.add('show');
  });

  installBtn?.addEventListener('click', async ()=>{
    if(!deferredPrompt) {
      showToast('Gunakan menu browser → Tambahkan ke layar utama.');
      return;
    }
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBanner.classList.remove('show');
  });

  window.addEventListener('appinstalled', ()=>{
    installBanner?.classList.remove('show');
    showToast('Master Command berhasil dipasang.');
  });

  function updateOnlineState(){
    document.body.classList.toggle('offline', !navigator.onLine);
  }
  window.addEventListener('online', updateOnlineState);
  window.addEventListener('offline', updateOnlineState);
  updateOnlineState();

  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      showToast('Aplikasi diperbarui.');
    });
    navigator.serviceWorker.ready.then(reg=>{
      reg.addEventListener('updatefound', ()=>{
        const worker = reg.installing;
        if(!worker) return;
        worker.addEventListener('statechange', ()=>{
          if(worker.state === 'installed' && navigator.serviceWorker.controller){
            updateBar?.classList.add('show');
          }
        });
      });
    });
  }

  updateBtn?.addEventListener('click', ()=>{
    location.reload();
  });

  // Expose a small native-like helper for the existing UI.
  window.masterCommandToast = showToast;
})();
</script>


<section class="pwa-diagnostic" id="pwaDiagnostic">
  <h3>📱 Status PWA</h3>
  <p>Periksa apakah deployment ini siap dipasang sebagai aplikasi.</p>
  <div id="pwaChecks"></div>
  <div class="pwa-tools">
    <button type="button" id="pwaRefresh">Periksa ulang</button>
    <button type="button" id="pwaClear">Bersihkan cache PWA</button>
  </div>
</section>


<script>
(function(){
  const box=document.getElementById('pwaChecks');
  if(!box)return;
  const row=(label,ok)=>`<div class="pwa-check"><span>${label}</span><span class="${ok?'pwa-ok':'pwa-bad'}">${ok?'🟢 OK':'🔴 Gagal'}</span></div>`;
  async function check(){
    let manifestOK=false, i192=false, i512=false, swOK=false;
    const secure=location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
    try{
      const link=document.querySelector('link[rel="manifest"]');
      const r=link?await fetch(link.href,{cache:'no-store'}):null;
      if(r&&r.ok){
        const m=await r.json();
        manifestOK=!!(m.name||m.short_name)&&!!m.start_url&&m.display==='standalone'
          &&Array.isArray(m.icons)&&m.icons.some(x=>x.sizes==='192x192')
          &&m.icons.some(x=>x.sizes==='512x512')&&m.prefer_related_applications!==true;
      }
    }catch(e){}
    try{i192=(await fetch('/icon-192.png',{cache:'no-store'})).ok;i512=(await fetch('/icon-512.png',{cache:'no-store'})).ok;}catch(e){}
    try{swOK=!!(await navigator.serviceWorker?.getRegistration?.());}catch(e){}
    box.innerHTML=row('HTTPS',secure)+row('Manifest',manifestOK)+row('Icon 192×192 PNG',i192)+row('Icon 512×512 PNG',i512)+row('Service Worker',swOK);
  }
  document.getElementById('pwaRefresh')?.addEventListener('click',check);
  document.getElementById('pwaClear')?.addEventListener('click',async()=>{
    try{for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();for(const k of await caches.keys())await caches.delete(k);}catch(e){}
    location.reload();
  });
  check();
})();
</script>
